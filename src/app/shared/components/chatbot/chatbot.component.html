<!-- Floating toggle button -->
<button class="chat-fab" (click)="toggle()" [attr.aria-label]="open() ? 'Close chat' : 'Open solar assistant'">
  @if (open()) {
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  } @else {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span class="chat-fab-label">Solar AI</span>
  }
</button>

<!-- Chat window -->
@if (open()) {
  <div class="chat-window" role="dialog" aria-label="Solar energy assistant">

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D3B60" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          </svg>
        </div>
        <div>
          <div class="chat-name">Dymo Solar AI</div>
          <div class="chat-status">
            <span class="chat-dot"></span> Online
          </div>
        </div>
      </div>
      <button class="chat-close" (click)="close()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" #messagesEl>
      @for (msg of history; track $index) {
        <div class="chat-msg" [class.chat-msg--user]="msg.role === 'user'" [class.chat-msg--bot]="msg.role === 'assistant'">
          @if (msg.role === 'assistant') {
            <div class="chat-msg-avatar">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2D3B60" stroke-width="2.5" stroke-linecap="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              </svg>
            </div>
          }
          <div class="chat-msg-bubble">{{ msg.content }}</div>
        </div>
      }

      @if (loading()) {
        <div class="chat-msg chat-msg--bot">
          <div class="chat-msg-avatar">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2D3B60" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            </svg>
          </div>
          <div class="chat-msg-bubble chat-typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      }
    </div>

    <!-- Quota exceeded banner -->
    @if (serviceUnavailable()) {
      <div class="chat-unavailable">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>AI service unavailable. <a routerLink="/quote" (click)="close()">Talk to our team →</a></span>
      </div>
    }

    <!-- Input -->
    <div class="chat-input-row" [class.chat-input-row--disabled]="serviceUnavailable()">
      <textarea
        class="chat-input"
        rows="1"
        [placeholder]="serviceUnavailable() ? 'AI unavailable — use /quote to contact us' : 'Ask about solar panels, sizing, savings…'"
        [(ngModel)]="inputText"
        (keydown)="onKeydown($event)"
        [disabled]="serviceUnavailable()"
      ></textarea>
      <button class="chat-send" (click)="send()" [disabled]="!inputText.trim() || loading() || serviceUnavailable()" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>
}
