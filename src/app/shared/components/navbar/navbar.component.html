<nav class="navbar">

  <!-- Row 1 -->
  <div class="row1">

    <!-- Left: globe badge -->
    <span class="globe-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
      </svg>
      Global EN
    </span>

    <!-- Centre: logo / brand (absolutely centred) -->
    <a class="brand" routerLink="/">
      @if (logoUrl) {
        <img [src]="logoUrl" [alt]="siteName" class="brand-logo" />
      } @else {
        <!-- Icon square + two-tone site name -->
        <span class="brand-icon" [style.background-color]="primaryColor || '#22c55e'">
          {{ brandInitial }}
        </span>
        <span class="brand-label">
          <span class="brand-dark">{{ brandPart1 }}</span><span
            class="brand-color" [style.color]="primaryColor || '#22c55e'">{{ brandPart2 }}</span>
        </span>
      }
    </a>

    <!-- Right: search · cart · login -->
    <div class="row1-right">
      <button class="r1-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <button class="r1-btn cart-btn" aria-label="Cart" (click)="openCart()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        @if (cartService.totalCount() > 0) {
          <span class="cart-badge">{{ cartService.totalCount() }}</span>
        }
      </button>

      <button class="r1-btn login-btn" aria-label="Login">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        LOGIN
      </button>

      <button class="r1-btn hamburger" (click)="toggleMobile()" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Row 2: nav links -->
  <div class="row2">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.route === '/' }"
         class="nav-link">
        {{ item.label }}
      </a>
    }
  </div>

  <!-- Mobile drawer -->
  @if (mobileOpen()) {
    <div class="mobile-nav">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active"
           class="mobile-link" (click)="toggleMobile()">{{ item.label }}</a>
      }
    </div>
  }

</nav>
