<footer class="site-footer">
  <div class="footer-inner">

    <!-- Logo / Brand -->
    <div class="footer-brand">
      @if (settings?.logoUrl) {
        <img [src]="settings!.logoUrl" [alt]="settings?.siteName" class="footer-logo" />
      } @else {
        <div class="footer-brand-mark">
          <div class="brand-icon">{{ brandInitial }}</div>
          <span class="brand-name">
            <span class="brand-word1">{{ brandWord1 }}</span>
            <span class="brand-word2"> {{ brandWord2 }}</span>
          </span>
        </div>
      }
    </div>

    <!-- Divider -->
    <div class="footer-divider"></div>

    <!-- Bottom bar -->
    <div class="footer-bottom">
      <span class="footer-copy">
        &copy; {{ currentYear }} {{ settings?.siteName || 'Dymo Energy' }}. All Rights Reserved.
      </span>
      <nav class="footer-links">
        <a href="#" class="footer-link">Privacy Policy</a>
        <a href="#" class="footer-link">Disclaimer</a>
        <a href="#" class="footer-link">Cookies Policy</a>
      </nav>
    </div>

  </div>
</footer>
